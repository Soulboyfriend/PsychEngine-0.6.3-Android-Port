name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      setupCommand:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string
      system:
        required: true
        type: string

env:
  HAXE_VERSION: 4.2.5
  PROJECT_NAME: PsychEngine

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1.2.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        if: inputs.system == 'Android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install Libraries
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.setupCommand }}

      - name: Configure Android
        if: inputs.system == 'Android'
        shell: bash
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          JAVA_PATH="${JAVA_HOME_17_X64:-${JAVA_HOME:-}}"

          echo "Android SDK: ${SDK_PATH:-<not set>}"
          echo "Android NDK: ${NDK_PATH:-<not set>}"
          echo "Java: ${JAVA_PATH:-<not set>}"

          if [[ -z "$SDK_PATH" || ! -d "$SDK_PATH" ]]; then
            echo "::error::Android SDK path is missing or does not exist."
            exit 1
          fi

          if [[ -z "$NDK_PATH" || ! -d "$NDK_PATH" ]]; then
            echo "::error::Android NDK path from setup-ndk is missing or does not exist."
            exit 1
          fi

          if [[ -z "$JAVA_PATH" || ! -d "$JAVA_PATH" ]]; then
            echo "::error::Java 17 path is missing or does not exist."
            exit 1
          fi

          haxelib run lime config ANDROID_SDK "$SDK_PATH"
          haxelib run lime config ANDROID_NDK_ROOT "$NDK_PATH"
          haxelib run lime config JAVA_HOME "$JAVA_PATH"
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          haxelib run lime build ${{ inputs.buildArgs }}

      - name: Make IPA For iOS Simulator
        if: inputs.system == 'iOS-Sim'
        shell: bash
        run: |
          set -euo pipefail
          cd export/release/ios/build/Release-iphonesimulator
          mkdir -p Payload
          mv *.app Payload/
          zip -r "${{ env.PROJECT_NAME }}.ipa" Payload

      - name: Make IPA For iOS
        if: inputs.system == 'iOS'
        shell: bash
        run: |
          set -euo pipefail
          cd export/release/ios/build/Release-iphoneos
          mkdir -p Payload
          mv *.app Payload/
          zip -r "${{ env.PROJECT_NAME }}.ipa" Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
